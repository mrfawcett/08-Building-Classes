name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integrity check - tests, pom.xml and grading.json must be unchanged
        run: |
          EXPECTED="9e02ffdb86477138875ba563ce18b9ee651a07b19037564693ece11762ff135f"
          ACTUAL=$( (for f in $(find src/test/java -type f -name '*.java' | LC_ALL=C sort) pom.xml grading.json; do sed 's/\r$//' "$f"; done) | sha256sum | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The test files, pom.xml, or grading.json in this repository differ from the assignment template. Grading has been stopped. Restore the original files (git checkout origin/main -- src/test pom.xml grading.json) and push again."
            exit 1
          fi
          echo "Integrity check passed."
      - name: "StepTracker: constructor, addDailySteps, activeDays (30)"
        id: steptracker
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "StepTracker: constructor, addDailySteps, activeDays"
          setup-command: ''
          command: mvn -B -q test -Dtest=StepTrackerTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 30
      - name: "StepTracker.averageSteps (20)"
        id: averagesteps
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "StepTracker.averageSteps"
          setup-command: ''
          command: mvn -B -q test -Dtest=AverageStepsTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 20
      - name: "MasterMind: constructor and getHint (50)"
        id: gethint
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "MasterMind: constructor and getHint"
          setup-command: ''
          command: mvn -B -q test -Dtest=GetHintTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 50
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          STEPTRACKER_RESULTS: "${{ steps.steptracker.outputs.result }}"
          AVERAGESTEPS_RESULTS: "${{ steps.averagesteps.outputs.result }}"
          GETHINT_RESULTS: "${{ steps.gethint.outputs.result }}"
        with:
          runners: steptracker,averagesteps,gethint
